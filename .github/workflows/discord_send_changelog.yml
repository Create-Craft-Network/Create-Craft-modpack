
      - name: Send changelog to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json

          with open("CHANGELOG.md", encoding="utf-8") as f:
              changelog = f.read()

          content = (
              "📢 **CHANGELOG UPDATED**\n"
              "━━━━━━━━━━━━━━━━━━━━\n\n"
              f"{changelog}\n\n"
              "━━━━━━━━━━━━━━━━━━━━\n"
              "📦 **Full changelog:**\n"
              "https://github.com/Create-Craft-Network/Create-Craft-modpack/blob/dev/CHANGELOG.md"
          )

          content = content[:1950]

          with open("discord_payload.json", "w", encoding="utf-8") as f:
              json.dump({
                  "content": content,
                  "allowed_mentions": {"parse": []}
              }, f)
          PY

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST \
            --data @discord_payload.json \
            "$WEBHOOK"
